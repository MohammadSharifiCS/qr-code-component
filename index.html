<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | QR code component</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body class="wrapper">

    <main class="card">
        <img id="qr-code" src="./images/image-qr-code.png" alt="QR code">
        <p id="outfit-title">Improve your front-end skills by building projects</p>
        <p id="outfit-description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next
            level</p>
    </main>

    <footer class="attribution">
        <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
                rel="noreferrer noopener">Frontend Mentor</a>.</p>
        <p>Coded by <a href="https://www.frontendmentor.io/profile/MohammadSharifiCS" target="_blank"
                rel="noreferrer noopener">Mohammad</a>.</p>
    </footer>
</body>

</html>
